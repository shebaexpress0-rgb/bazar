.wrap{max-width:720px;margin:auto;padding:0 14px}

.btn.red,.red{background:none;border:1.5px solid var(--r);color:var(--r)}
.lnk{background:none;border:0;color:var(--g);text-decoration:underline;font-size:14px}
.sech{display:flex;justify-content:space-between;align-items:center}
.flt{display:flex;gap:8px;margin:6px 0 10px}
.flt input{flex:2}.flt select{flex:1}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--b);border-radius:12px;font:inherit;background:var(--c);color:var(--t)}

.two{display:flex;gap:8px;margin-top:8px}.two>*{flex:1}

.pi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--b)}

.sum{background:#eff6f0;border:1px solid #dcebdd;border-radius:15px;padding:14px;margin:14px 0}

<script>
/* ============ এখানে আপনার তথ্য বসান ============ */
const FIREBASE_CONFIG = { apiKey:"", authDomain:"", projectId:"", appId:"" }; // Firebase থেকে পাওয়া কোড (খালি থাকলে ডেমো মোড)

/* ============ পণ্য, দাম ও প্যাকেজ: এখানে বদলাবেন (দাম 0 মানে "দাম পরে নিশ্চিত হবে") ============ */

// [নাম, ক্যাটাগরি, একক, প্রতি এককে দাম, [ব্র্যান্ড...]]
const SHOP_PRODUCTS = [
 ['চাল','চাল-ডাল','কেজি',0,[]],['মসুর ডাল','চাল-ডাল','কেজি',0,[]],['মুগ ডাল','চাল-ডাল','কেজি',0,[]],['ছোলা','চাল-ডাল','কেজি',0,[]],
 ['আটা','চাল-ডাল','কেজি',0,[]],['ময়দা','চাল-ডাল','কেজি',0,[]],['সুজি','চাল-ডাল','কেজি',0,[]],
 ['সয়াবিন তেল','তেল-মসলা','লিটার',0,[]],['চিনি','তেল-মসলা','কেজি',0,[]],['লবণ','তেল-মসলা','কেজি',0,[]],
 ['হলুদ গুঁড়া','তেল-মসলা','কেজি',0,[]],['মরিচ গুঁড়া','তেল-মসলা','কেজি',0,[]],['জিরা','তেল-মসলা','কেজি',0,[]],['ধনিয়া গুঁড়া','তেল-মসলা','কেজি',0,[]],
 ['পেঁয়াজ','সবজি','কেজি',0,[]],['রসুন','সবজি','কেজি',0,[]],['আদা','সবজি','কেজি',0,[]],['আলু','সবজি','কেজি',0,[]],['ডিম','সবজি','হালি',0,[]],
 ['সাবান','পরিষ্কার-পরিচ্ছন্নতা','পিস',0,[]],['ডিটারজেন্ট পাউডার','পরিষ্কার-পরিচ্ছন্নতা','কেজি',0,[]],['থালা-বাসন মাজার লিকুইড','পরিষ্কার-পরিচ্ছন্নতা','পিস',0,[]]
];
// [নাম, কত জন, [[পণ্যের নাম, পরিমাণ, একক], ...]]
const SHOP_PACKAGES = [
 ['২ জনের পরিবার',2,[['চাল',10,'কেজি'],['মসুর ডাল',1,'কেজি'],['সয়াবিন তেল',2,'লিটার'],['চিনি',1,'কেজি'],['লবণ',1,'কেজি'],['পেঁয়াজ',2,'কেজি'],['আলু',3,'কেজি'],['হলুদ গুঁড়া',100,'গ্রাম'],['মরিচ গুঁড়া',100,'গ্রাম']]],
 ['৪ জনের পরিবার',4,[['চাল',20,'কেজি'],['মসুর ডাল',2,'কেজি'],['সয়াবিন তেল',4,'লিটার'],['চিনি',2,'কেজি'],['আটা',2,'কেজি'],['লবণ',1,'কেজি'],['পেঁয়াজ',4,'কেজি'],['রসুন',500,'গ্রাম'],['আদা',500,'গ্রাম'],['আলু',5,'কেজি'],['ডিম',3,'হালি'],['হলুদ গুঁড়া',200,'গ্রাম'],['মরিচ গুঁড়া',200,'গ্রাম']]],
 ['৬ জনের পরিবার',6,[['চাল',30,'কেজি'],['মসুর ডাল',3,'কেজি'],['মুগ ডাল',1,'কেজি'],['সয়াবিন তেল',5,'লিটার'],['চিনি',3,'কেজি'],['আটা',3,'কেজি'],['লবণ',2,'কেজি'],['পেঁয়াজ',6,'কেজি'],['রসুন',1000,'গ্রাম'],['আদা',1000,'গ্রাম'],['আলু',8,'কেজি'],['ডিম',5,'হালি'],['সাবান',4,'পিস'],['ডিটারজেন্ট পাউডার',1,'কেজি'],['হলুদ গুঁড়া',300,'গ্রাম'],['মরিচ গুঁড়া',300,'গ্রাম'],['জিরা',200,'গ্রাম']]]
];
/* ============================================================================================ */

const DEMO = !FIREBASE_CONFIG.apiKey;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('bn-BD');
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r3 = x => Math.round(x * 1000) / 1000;
const LS = {
  get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};

/* ---------- একক ---------- */
const UNITS = {'গ্রাম':['w',.001],'কেজি':['w',1],'মিলি':['v',.001],'লিটার':['v',1],'পিস':['c',1],'হালি':['c',4],'ডজন':['c',12],'প্যাকেট':['p',1],'বোতল':['b',1],'কৌটা':['k',1]};
const STEP = {'গ্রাম':50,'মিলি':50,'কেজি':.5,'লিটার':.5};
const stepOf = u => STEP[u] || 1;
const unitOpts = (u, sel, all) => Object.keys(UNITS).filter(k => all || !UNITS[u] || UNITS[k][0] === UNITS[u][0]).map(k => `<option ${k===sel?'selected':''}>${k}</option>`).join('');
function lineTotal(it){
  if(!it.price || !it.punit) return null;
  const a = UNITS[it.unit], b = UNITS[it.punit];
  if(!a || !b || a[0] !== b[0]) return null;
  return Math.round(it.qty * a[1] / b[1] * it.price);
}
const STATUSES = ['নতুন','নিশ্চিত','ডেলিভারি হয়েছে','বাতিল'];

/* ---------- ব্যাকএন্ড (Firebase বা ডেমো) ---------- */
let fb = null;
async function initBackend(){
  if(DEMO) return;
  const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
  const [A, F, Au] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-firestore.js'), import(base+'firebase-auth.js')]);
  const app = A.initializeApp(FIREBASE_CONFIG);
  fb = {F, Au, db:F.getFirestore(app), auth:Au.getAuth(app)};
}
async function dbList(col, o = {}){
  if(DEMO){
    let a = Object.entries(LS.get('d_'+col, {})).map(([id,v]) => ({id, ...v}));
    if(o.where) a = a.filter(x => x[o.where[0]] === o.where[2]);
    if(o.orderBy) a.sort((x,y) => y[o.orderBy] - x[o.orderBy]);
    if(o.limit) a = a.slice(0, o.limit);
    return a;
  }
  const F = fb.F, c = [];
  if(o.where) c.push(F.where(...o.where));
  if(o.orderBy) c.push(F.orderBy(o.orderBy, 'desc'));
  if(o.limit) c.push(F.limit(o.limit));
  const s = await F.getDocs(F.query(F.collection(fb.db, col), ...c));
  return s.docs.map(d => ({id:d.id, ...d.data()}));
}
async function dbSet(col, id, data){
  const {id:_x, ...d} = data; const clean = JSON.parse(JSON.stringify(d));
  if(DEMO){const o = LS.get('d_'+col, {}); o[id] = clean; LS.set('d_'+col, o); return}
  await fb.F.setDoc(fb.F.doc(fb.db, col, id), clean);
}
async function dbPatch(col, id, patch){
  if(DEMO){const o = LS.get('d_'+col, {}); o[id] = {...o[id], ...patch}; LS.set('d_'+col, o); return}
  await fb.F.updateDoc(fb.F.doc(fb.db, col, id), patch);
}
async function dbDel(col, id){
  if(DEMO){const o = LS.get('d_'+col, {}); delete o[id]; LS.set('d_'+col, o); return}
  await fb.F.deleteDoc(fb.F.doc(fb.db, col, id));
}
